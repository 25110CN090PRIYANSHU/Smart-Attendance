services:
  - type: web
    name: smartattend-x
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DEVICE_HASH_SECRET
        generateValue: true
      - key: TEACHER_REGISTRATION_CODE
        value: TEACHER2026
      - key: ADMIN_EMAIL
        value: admin@smartattend.edu
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: NODE_ENV
        value: production
