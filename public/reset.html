<!doctype html>
<html lang="en" class="light-mode">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Reset Password - SmartAttend</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/dark-pro.css" />
  </head>
  <body class="login-page light-mode">
    <button
      id="darkModeToggle"
      class="dark-mode-toggle"
      onclick="toggleDarkMode()"
    >
      🌙
    </button>
    <main class="login-container">
      <section class="login-card" style="margin: auto">
        <div class="login-card-header">
          <div class="login-icon">🔑</div>
          <h2>Reset Password</h2>
          <p>Choose a new password for your SmartAttend account.</p>
        </div>
        <div class="input-group">
          <label>New password</label>
          <div class="input-wrapper">
            <input
              id="newPassword"
              type="password"
              minlength="6"
              placeholder="At least 6 characters"
            /><button
              type="button"
              class="password-toggle"
              onclick="toggleNew()"
            >
              👁️
            </button>
          </div>
        </div>
        <button class="login-button" onclick="resetPassword()">
          Update Password →
        </button>
        <p id="message" class="login-message"></p>
        <div class="register-section">
          <a href="index.html">Back to login</a>
        </div>
      </section>
    </main>
    <script>
      function toggleNew() {
        const x = document.getElementById("newPassword");
        x.type = x.type === "password" ? "text" : "password";
      }
      async function resetPassword() {
        const token = new URLSearchParams(location.search).get("token");
        const p = document.getElementById("newPassword").value,
          m = document.getElementById("message");
        if (!token || p.length < 6) {
          m.textContent = "Invalid reset link or password too short.";
          return;
        }
        try {
          const r = await fetch("/api/auth/reset-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token, password: p }),
          });
          const d = await r.json();
          m.textContent = d.message || "Done";
          if (r.ok) setTimeout(() => (location.href = "index.html"), 1200);
        } catch (e) {
          m.textContent = "Unable to reset password.";
        }
      }
    </script>
    <script src="js/darkmode.js"></script>
  </body>
</html>
